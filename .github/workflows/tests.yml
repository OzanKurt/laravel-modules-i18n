name: tests

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4']
                laravel: ['13.*']
                include:
                    - laravel: 13.*
                      testbench: 11.*
                # Pest 5 requires PHP ^8.4 and pest-plugin-laravel ^5 requires
                # laravel/framework ^13.23, so 8.3 and Laravel 12 are out.

        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: pcov
                  tools: composer:v2

            - name: Cache composer
              uses: actions/cache@v4
              with:
                  path: ~/.composer/cache
                  key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}

            - name: Require Laravel ${{ matrix.laravel }}
              run: |
                  composer require --no-update --no-interaction \
                      "illuminate/contracts:${{ matrix.laravel }}" \
                      "illuminate/filesystem:${{ matrix.laravel }}" \
                      "illuminate/support:${{ matrix.laravel }}" \
                      "orchestra/testbench:${{ matrix.testbench }}"

            - name: Install
              run: composer update --prefer-stable --prefer-dist --no-interaction

            - name: Pint
              run: vendor/bin/pint --test

            - name: PHPStan
              run: vendor/bin/phpstan analyse --memory-limit=2G

            - name: Pest
              run: vendor/bin/pest --coverage --min=80

    assets:
        runs-on: ubuntu-latest
        name: Assets (dist in sync)

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install
              run: npm ci

            - name: Build
              run: npm run build

            - name: Verify resources/dist is committed and in sync
              run: git diff --exit-code -- resources/dist
